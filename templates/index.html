<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player - Globo News</title>
    <link rel="preconnect" href="https://sinaldvd.github.io" crossorigin="">
    <link rel="preconnect" href="https://sinalpublicoetv.vercel.app" crossorigin="">
    
    <!-- Script de proteção ajustado para a pasta static -->
    <script disable-devtool-auto="" src="/static/scripts/disable-devtools.js"></script>
    
    <style>
        :root { --primary:#007bff; --danger:#ff3b3b; --bg:#000; --card:#111; --text:#fff; }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:Arial, Helvetica, sans-serif; }
        
        /* PLAYER FULLSCREEN */
        #player { position:fixed; inset:0; width:100%; height:100%; border:none; background:#000; }
        
        /* MENSAGENS DE ERRO/SANDBOX */
        .box { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:20px; background:#000; z-index:9999; }
        .card { width:100%; max-width:500px; background:var(--card); border-radius:16px; padding:30px; text-align:center; color:#fff; border:1px solid rgba(255,255,255,.08); }
        .logo { width:100px; margin-bottom:20px; }
        .title { font-size:26px; font-weight:700; margin-bottom:15px; color:var(--primary); }
        .desc { font-size:15px; line-height:1.6; opacity:.9; margin-bottom:20px; }
        .button { display:inline-flex; align-items:center; justify-content:center; height:46px; padding:0 24px; border-radius:999px; background:var(--primary); color:#fff; text-decoration:none; font-weight:700; }
        .button:hover { opacity:.9; }
        #channel { margin-top:15px; opacity:.7; font-size:14px; }
    </style>
</head>
<body>
    <!-- O Player carrega o sinal via iframe -->
    <iframe id="player" allowfullscreen referrerpolicy="origin" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" src="https://sinaldvd.github.io/tv/player.html?id=globonews"></iframe>

    <!-- Alerta de Sandbox -->
    <div class="box" id="sandbox">
        <div class="card">
            <img class="logo" src="/static/images/iconpage.png" alt="Logo">
            <div class="title"> Sandbox Detectado </div>
            <div class="desc"> Remova o atributo sandbox do iframe para o player funcionar corretamente. </div>
            <a class="button" href="https://sinalpublic.vercel.app" target="_blank"> Abrir Site </a>
        </div>
    </div>

    <!-- Alerta de Erro -->
    <div class="box" id="error">
        <div class="card">
            <img class="logo" src="/static/images/iconpage.png" alt="Logo">
            <div class="title" style="color:var(--danger)"> Canal Não Encontrado </div>
            <div class="desc"> Não foi possível carregar o canal. </div>
            <div id="channel"></div>
        </div>
    </div>
